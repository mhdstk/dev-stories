name: Dev Stories CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Run tests
      run: npm test -- --coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Build extension
      run: npm run compile
    
    - name: Build webview
      run: |
        cd webview-ui
        npm ci
        npm run build

  package:
    needs: test
    runs-on: ubuntu-latest
    # Run on pushes to main branch or releases
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build webview
      run: |
        cd webview-ui
        npm ci
        npm run build
    
    - name: Build extension
      run: npm run package
    
    - name: Package extension
      run: npx vsce package
    
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: dev-stories-extension
        path: '*.vsix'

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    # Only publish on releases
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build webview
      run: |
        cd webview-ui
        npm ci
        npm run build
        cd ..
    
    - name: Build extension
      run: npm run package
    
    - name: Publish to VS Code Marketplace
      if: env.VSCE_TOKEN != ''
      env:
        VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      run: npx vsce publish -p $VSCE_TOKEN
    
    - name: Publish to OpenVSX
      if: env.OVSX_TOKEN != ''
      env:
        OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      run: |
        npm install -g ovsx
        npx vsce package
        npx ovsx publish *.vsix -p $OVSX_TOKEN

  deploy-web-viewer:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy web viewer to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./openvsx-integration/web-viewer
        destination_dir: web-viewer