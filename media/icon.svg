<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#007acc"/>
  
  <!-- Story ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Inner icon - broadcast/stories symbol -->
  <g transform="translate(44, 44)">
    <!-- Broadcasting icon -->
    <circle cx="20" cy="20" r="8" fill="#ffffff"/>
    
    <!-- Signal waves -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <circle cx="20" cy="20" r="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <circle cx="20" cy="20" r="32" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  </g>
  
  <!-- Code brackets to indicate developer focus -->
  <text x="20" y="85" fill="#ffffff" font-family="monospace" font-size="14" opacity="0.8">&lt;/&gt;</text>
</svg>